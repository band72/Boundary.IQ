# ─── Google Cloud Build — CI/CD Pipeline ─────────────────────────────────────
# Project: BoundaryIQ (gen-lang-client-0357875004)
#
# Manual deploy:
#   gcloud builds submit --config cloudbuild.yaml . --project=gen-lang-client-0357875004
#
# Auto-deploy on push to main (one-time setup):
#   gcloud builds triggers create github \
#     --repo-name=Boundary.IQ --repo-owner=band72 \
#     --branch-pattern=^main$ --build-config=cloudbuild.yaml \
#     --project=gen-lang-client-0357875004

substitutions:
  _REGION: us-central1
  _SERVICE: boundary-iq
  _IMAGE: gcr.io/gen-lang-client-0357875004/boundary-iq
  _TAG: latest   # overridden to $SHORT_SHA in triggered builds via --substitutions

steps:
  # ── 1. Build Docker image ───────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - build
      - '--tag=$_IMAGE:$_TAG'
      - '--tag=$_IMAGE:latest'
      - '--cache-from=$_IMAGE:latest'
      - '.'

  # ── 2. Push image to Container Registry ────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args:
      - push
      - '--all-tags'
      - '$_IMAGE'
    waitFor: [build]

  # ── 3. Deploy to Cloud Run (with secrets from Secret Manager) ───────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_SERVICE'
      - '--image=$_IMAGE:$_TAG'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=5050'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--timeout=3600'
      - '--set-env-vars=NODE_ENV=production,ACTIVE_PROVIDER=gemini,ACTIVE_MODEL=gemini-3.5-flash,ALLOW_API_FALLBACK=true,STRIPE_BASIC_PRICE_ID=price_1TnINL2S1lrWwZ14vJIV9WBk,STRIPE_PRO_PRICE_ID=price_1TnL1N2S1lrWwZ14SfUXOc0I,STRIPE_ENTERPRISE_PRICE_ID=price_1TnL2q2S1lrWwZ14ghVlaB2N,GOOGLE_CLIENT_ID=318563891368-v62a25njk12jj0jc9ff9rtrjv3gfaag0.apps.googleusercontent.com,EMAIL_FROM=noreply@iq.banks.land'
      - '--update-secrets=GEMINI_API_KEY=gemini-api-key:latest,STRIPE_SECRET_KEY=stripe-secret:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook:latest,RESEND_API_KEY=resend-api-key:latest'
    waitFor: [push]

images:
  - '$_IMAGE:$_TAG'
  - '$_IMAGE:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 1200s
