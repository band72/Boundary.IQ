# ─── Google Cloud Build — CI/CD Pipeline ─────────────────────────────────────
# Triggered automatically on push to `main` (configure in Cloud Build console).
#
# Usage (one-time setup):
#   gcloud builds triggers create github \
#     --repo-name=Boundary.IQ --repo-owner=band72 \
#     --branch-pattern=^main$ --build-config=cloudbuild.yaml
#
# Manual run:
#   gcloud builds submit --config cloudbuild.yaml .

substitutions:
  _REGION: us-central1
  _SERVICE: boundary-iq
  _IMAGE: gcr.io/$PROJECT_ID/boundary-iq

steps:
  # ── 1. Build Docker image ───────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - build
      - '--tag=$_IMAGE:$SHORT_SHA'
      - '--tag=$_IMAGE:latest'
      - '--cache-from=$_IMAGE:latest'
      - '.'

  # ── 2. Push image to Container Registry ────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args:
      - push
      - '--all-tags'
      - '$_IMAGE'
    waitFor: [build]

  # ── 3. Deploy to Cloud Run ──────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_SERVICE'
      - '--image=$_IMAGE:$SHORT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=5050'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=3600'
      - '--set-env-vars=NODE_ENV=production,ACTIVE_PROVIDER=gemini,ACTIVE_MODEL=gemini-2.5-flash,ALLOW_API_FALLBACK=true'
      # Secrets below are stored in Secret Manager — not hardcoded here.
      # Set them via:
      #   gcloud run services update boundary-iq \
      #     --update-secrets=GEMINI_API_KEY=gemini-api-key:latest,STRIPE_SECRET_KEY=stripe-secret:latest
    waitFor: [push]

images:
  - '$_IMAGE:$SHORT_SHA'
  - '$_IMAGE:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 1200s
