<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium Dark Theme -->
  <rect width="100%" height="100%" fill="#0d1117" />
  
  <defs>
    <!-- Background Grids -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1" />
    </pattern>
    <pattern id="subgrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#161b22" stroke-width="0.5" />
    </pattern>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#subgrid)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Outer double border frame -->
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#30363d" stroke-width="1.5" />
  <rect x="25" y="25" width="1150" height="750" fill="none" stroke="#58a6ff" stroke-width="1.5" />
  
  <!-- Header horizontal divider -->
  <line x1="25" y1="80" x2="1175" y2="80" stroke="#58a6ff" stroke-width="1.5" />
  
  <!-- Main vertical divider -->
  <line x1="800" y1="80" x2="800" y2="775" stroke="#58a6ff" stroke-width="1.5" />
  
  <!-- Centered Title inside header -->
  <text x="600" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="20" fill="#58a6ff" text-anchor="middle" letter-spacing="1.5">CONCEPTUAL SURVEY PLAN — CONCEPTUAL_MAP</text>
  
  <!-- Column Headers -->
  <text x="45" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="13" fill="#8b949e" letter-spacing="0.5">I. BOUNDARY TRAVERSE PLAN</text>
  <text x="820" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="13" fill="#8b949e" letter-spacing="0.5">II. SURVEY DATA TABLES</text>
  
  <!-- Compass Rose -->
  <g transform="translate(130, 220)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#30363d" stroke-width="1.5" />
    <line x1="0" y1="-45" x2="0" y2="45" stroke="#ff4444" stroke-width="2" />
    <line x1="-45" y1="0" x2="45" y2="0" stroke="#30363d" stroke-width="1.5" />
    <polygon points="0,-45 -6,-12 0,-18 6,-12" fill="#ff4444" />
    <polygon points="0,45 -6,12 0,18 6,12" fill="#8b949e" />
    <polygon points="-45,0 -12,-6 -18,0 -12,6" fill="#8b949e" />
    <polygon points="45,0 12,-6 18,0 12,6" fill="#8b949e" />
    <text x="0" y="-52" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#ff4444" text-anchor="middle" font-weight="bold">N</text>
    <text x="0" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">S</text>
    <text x="58" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">E</text>
    <text x="-58" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">W</text>
  </g>
  
  <!-- Scale Bar -->
  <g transform="translate(650, 730)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#c9d1d9" stroke-width="2.5" />
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#c9d1d9" stroke-width="2.5" />
    <line x1="60" y1="-6" x2="60" y2="6" stroke="#c9d1d9" stroke-width="1.5" />
    <line x1="120" y1="-6" x2="120" y2="6" stroke="#c9d1d9" stroke-width="2.5" />
    <text x="60" y="-12" font-family="'Courier New', monospace" font-size="11" fill="#c9d1d9" text-anchor="middle" font-weight="bold">SCALE: ~85.7 FT</text>
  </g>

  <!-- Boundary Path (Shadow + Glow + Main Stroke) -->
  <polygon points="426.10037469714825,665.0 324.4002480415224,240.98098057226844 313.00781239011843,193.48242228473475 531.9836084847641,190.0 293.01639151523597,193.8003504338721" fill="#58a6ff" fill-opacity="0.08" stroke="#58a6ff" stroke-width="3" stroke-linejoin="round" filter="url(#glow)" />
  <polygon points="426.10037469714825,665.0 324.4002480415224,240.98098057226844 313.00781239011843,193.48242228473475 531.9836084847641,190.0 293.01639151523597,193.8003504338721" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Vertices and Labels -->
  <circle cx="426.10037469714825" cy="665.0" r="4.5" fill="#ffffff" stroke="#ff7b72" stroke-width="2" />
  <text x="434.10037469714825" y="657.0" font-family="monospace" font-size="10" fill="#8b949e" font-weight="bold">P0</text>
  <circle cx="324.4002480415224" cy="240.98098057226844" r="4.5" fill="#ffffff" stroke="#ff7b72" stroke-width="2" />
  <text x="332.4002480415224" y="232.98098057226844" font-family="monospace" font-size="10" fill="#8b949e" font-weight="bold">P1</text>
  <circle cx="313.00781239011843" cy="193.48242228473475" r="4.5" fill="#ffffff" stroke="#ff7b72" stroke-width="2" />
  <text x="321.00781239011843" y="185.48242228473475" font-family="monospace" font-size="10" fill="#8b949e" font-weight="bold">P2</text>
  <circle cx="531.9836084847641" cy="190.0" r="4.5" fill="#ffffff" stroke="#ff7b72" stroke-width="2" />
  <text x="539.9836084847641" y="182.0" font-family="monospace" font-size="10" fill="#8b949e" font-weight="bold">P3</text>
  <!-- Label L1 -->
  <text x="357.7467364809167" y="457.18868824782214" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" stroke="#0d1117" stroke-width="4" stroke-linejoin="round">L1</text>
  <text x="357.7467364809167" y="457.18868824782214" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#ff7b72">L1</text>
  <!-- Label L2 -->
  <text x="301.20045532740176" y="221.42989939018952" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" stroke="#0d1117" stroke-width="4" stroke-linejoin="round">L2</text>
  <text x="301.20045532740176" y="221.42989939018952" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#ff7b72">L2</text>
  <!-- Label L3 -->
  <text x="422.20948850329665" y="173.74348692499993" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" stroke="#0d1117" stroke-width="4" stroke-linejoin="round">L3</text>
  <text x="422.20948850329665" y="173.74348692499993" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#ff7b72">L3</text>
  <!-- Label L4 -->
  <text x="412.21377806585537" y="173.9024509995686" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" stroke="#0d1117" stroke-width="4" stroke-linejoin="round">L4</text>
  <text x="412.21377806585537" y="173.9024509995686" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#ff7b72">L4</text>

  <!-- Details Legend Panel -->
  <rect x="815" y="140" width="345" height="200" rx="8" fill="#161b22" fill-opacity="0.95" stroke="#30363d" stroke-width="1.5" />
  <text x="835" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="14" fill="#58a6ff">CONCEPTUAL SURVEY MAP</text>
  <line x1="835" y1="180" x2="1140" y2="180" stroke="#30363d" stroke-width="1" />
  
  <text x="835" y="205" font-family="'Courier New', monospace" font-size="12" fill="#c9d1d9">ACREAGE:     0.5024 AC</text>
  <text x="835" y="230" font-family="'Courier New', monospace" font-size="12" fill="#c9d1d9">SQUARE FT:   21,882.89 SQ FT</text>
  <text x="835" y="255" font-family="'Courier New', monospace" font-size="12" fill="#c9d1d9">CLOSURE ERR: 1053.0295 FT</text>
  <text x="835" y="280" font-family="'Courier New', monospace" font-size="12" fill="#c9d1d9">TOTAL CALLS: 5</text>
  <text x="835" y="305" font-family="'Courier New', monospace" font-size="10" fill="#8b949e">DATUM: local/project origin</text>
  
  <!-- Boundary Calls Table -->
  <g transform="translate(815, 360)">
    <rect x="0" y="0" width="345" height="400" rx="8" fill="#161b22" fill-opacity="0.9" stroke="#30363d" stroke-width="1.5" />
    <text x="20" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="13" fill="#58a6ff">SURVEY COGO CALLS LIST</text>
    <line x1="20" y1="38" x2="325" y2="38" stroke="#30363d" stroke-width="1" />
    <text x="20" y="60" font-family="monospace" font-size="11" fill="#c9d1d9">L1: N 13°29'15" W - 937.78ft</text>
    <text x="20" y="80" font-family="monospace" font-size="11" fill="#c9d1d9">L2: N 13°29'15" W - 105.05ft</text>
    <text x="20" y="100" font-family="monospace" font-size="11" fill="#c9d1d9">L3: N 89º05’20”E - 471.00ft</text>
    <text x="20" y="120" font-family="monospace" font-size="11" fill="#c9d1d9">C1: Curve R=N/A L=121.8</text>
    <text x="20" y="140" font-family="monospace" font-size="11" fill="#c9d1d9">L4: S 89º05’20”W - 514.00ft</text>
  </g>
</svg>